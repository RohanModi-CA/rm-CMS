<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RM-CMS | Sign Up</title>
    <link rel="stylesheet" href="convert.css">
    <style>
        .login-container { max-width: 450px; margin: 50px auto; padding: 20px; border: 1px solid black; display: flex; flex-direction: column; gap: 15px; }
        input { padding: 8px; font-family: monospace; }
        button { padding: 10px; cursor: pointer; font-family: monospace; }
        #signup-json-output { width: 100%; height: 200px; font-size: 10px; margin-top: 10px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hash-wasm@4.11.0/dist/argon2.umd.min.js"></script>
</head>
<body>
    <div class="main-container">
        <div class="title"><h1>RM-CMS</h1></div>
        <div class="login-container">
            <h3>Step 1: Create Account</h3>
            <input type="text" id="signup-username" placeholder="Username">
            <input type="password" id="signup-password" placeholder="Password">
            
            <hr>
            <h3>Step 2: Add WebAuthn (Optional)</h3>
            <button id="webauthn-button" style="background-color: #e6f7ff;">Link Security Key</button>
            <span id="webauthn-status" style="font-size: 12px; text-align: center;">No key linked.</span>

            <hr>
            <button id="signup-button" style="background-color: #e6ffed;">Generate Final JSON</button>
            <textarea id="signup-json-output" readonly placeholder="JSON will appear here..."></textarea>
            
            <p style="text-align:center; font-size: 14px;"><a href="login.html">Back to Login</a></p>
        </div>
    </div>
    <script type="module" src="signup.js"></script>
</body>
</html>
